name: openmeet

x-backend-image: &backend-image
  image: openmeet-backend:local
  build:
    context: .
    dockerfile: Dockerfile
    target: backend-runtime

x-backend-environment: &backend-environment
  DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+asyncpg://openmeet:openmeet_password@db:5432/openmeet}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openmeet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openmeet_password}
      POSTGRES_DB: ${POSTGRES_DB:-openmeet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - openmeet

  db-init:
    <<: *backend-image
    restart: "no"
    environment:
      <<: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    networks:
      - openmeet

  seed:
    <<: *backend-image
    profiles: ["demo"]
    restart: "no"
    environment:
      <<: *backend-environment
    depends_on:
      db-init:
        condition: service_completed_successfully
    command: ["python", "seed.py"]
    networks:
      - openmeet

  backend:
    <<: *backend-image
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-environment
      DEBUG: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-openmeet-local-compose-secret-change-before-deployment}
      CORS_ORIGINS: ${COMPOSE_CORS_ORIGINS:-http://localhost:8080}
      FRONTEND_URL: ${COMPOSE_FRONTEND_URL:-http://localhost:8080}
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8000/health/ready
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - openmeet

  frontend:
    image: openmeet-frontend:local
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      ORIGIN: ${COMPOSE_FRONTEND_URL:-http://localhost:8080}
      PUBLIC_GRAPHQL_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:3000/
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - openmeet

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/health/live
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - openmeet

volumes:
  postgres_data:

networks:
  openmeet:
    driver: bridge
